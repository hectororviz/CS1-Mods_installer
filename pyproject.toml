[project]
name = "CS1-Mods_installer"
version = "1.0.0"
description = "Gestor de mods para Cities: Skylines con interfaz web local"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.scripts]
cs1-mods-installer = "cs1_mods_installer.__main__:main"
cs1mods = "cs1_mods_installer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cs1_mods_installer"]

[tool.ruff]
line-length = 100
target-version = "py311"
