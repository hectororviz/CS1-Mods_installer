<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS1 Mods Installer · mods instalados</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🏙️</span>
    <div>
      <h1>CS1 Mods Installer</h1>
      <p class="sub" id="gameLine">detectando el juego…</p>
    </div>
  </div>

  <div class="searchbox">
    <input id="url" type="text" placeholder="Pegar enlace smods/Steam o ID y Enter…" autocomplete="off" spellcheck="false">
    <button id="urlGo" class="ghost" title="Abrir ficha">Abrir</button>
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="installed" role="tab">Instalados <span class="pill" id="cntInstalled">0</span></button>
  </nav>
</header>

<div id="banner" class="banner" hidden></div>

<main>
  <!-- ── instalados: la web solo administra lo instalado ────────── -->
  <section id="view-installed" class="view is-active">
    <div class="toolbar">
      <div class="filters">
        <button class="chip is-active" data-ifilter="">Todo</button>
        <button class="chip" data-ifilter="enabled">Activos</button>
        <button class="chip" data-ifilter="disabled">Desactivados</button>
        <button class="chip" data-ifilter="managed">Gestionados por CS1 Mods Installer</button>
      </div>
      <p class="muted" id="installedPaths"></p>
    </div>
    <div id="instList" class="list"></div>
  </section>
</main>

<!-- ── modal de detalle ─────────────────────────────────────── -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <button class="close" id="modalClose" title="Cerrar">✕</button>
    <div class="modal-body">
      <img id="mImg" class="m-img" alt="" loading="lazy">
      <div class="m-info">
        <h2 id="mTitle"></h2>
        <div id="mBadges" class="badges"></div>
        <dl id="mMeta" class="meta"></dl>
        <div class="m-actions" id="mActions"></div>
        <details class="m-desc">
          <summary>Descripción</summary>
          <pre id="mDesc"></pre>
        </details>
        <p class="muted small" id="mLinks"></p>
      </div>
    </div>
  </div>
</div>

<!-- ── avisos de tarea ──────────────────────────────────────── -->
<div id="toasts" class="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
